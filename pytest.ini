[pytest]
pythonpath = . src
# A test that hangs (e.g. a real, unmocked messagebox dialog blocking on a
# human click - see src/CLAUDE.md's Known testing quirks) previously hung
# forever with no error. 30s is generous next to the suite's normal ~15s
# total runtime, so this should only ever fire on a genuine hang, not a
# legitimately slow test.
timeout = 30