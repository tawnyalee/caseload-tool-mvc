<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Template Editor</title>
<link rel="stylesheet" href="quill.snow.css">
<style>
    body {
        font-family: Segoe UI, Arial, sans-serif;
        margin: 0;
        padding: 15px;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }
    label {
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
    }
    #name-input {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    #editor-container {
        flex: 1;
        background-color: white;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
    }
    #editor {
        flex: 1;
        overflow-y: auto;
        font-size: 14px;
    }
    #button-row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }
    button {
        padding: 8px 20px;
        font-size: 14px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
    }
    #save-btn {
        background-color: #1f538d;
        color: white;
    }
    #cancel-btn {
        background-color: transparent;
        border: 1px solid #999;
        color: #333;
    }
</style>
</head>
<body>

    <label for="name-input">Template Name</label>
    <input type="text" id="name-input" placeholder="e.g., Welcome Email Body">

    <div id="editor-container">
        <div id="editor"></div>
    </div>

    <div id="button-row">
        <button id="cancel-btn" onclick="onCancelClicked()">Cancel</button>
        <button id="save-btn" onclick="onSaveClicked()">💾 Save Template</button>
    </div>

    <script src="quill.js"></script>
    <script>
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link'],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    ['clean']
                ]
            }
        });

        function loadTemplate(name, htmlBody) {
            document.getElementById('name-input').value = name || '';
            quill.root.innerHTML = htmlBody || '';
        }

        function getSaveData() {
            return {
                name: document.getElementById('name-input').value.trim(),
                body: quill.root.innerHTML
            };
        }

        function onSaveClicked() {
            const data = getSaveData();
            if (!data.name) {
                alert('Template name cannot be empty.');
                return;
            }
            window.pywebview.api.on_save(data.name, data.body);
        }

        function onCancelClicked() {
            window.pywebview.api.on_cancel();
        }
    </script>

</body>
</html>
